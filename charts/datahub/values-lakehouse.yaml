# This repository's settings for upstream's datahub chart 1.1.7 (ADR-071, ADR-072); every other
# file here is upstream's release archive, but the one line ADR-072 §1 patches. Nothing comes from
# `.env`: the credentials reach the chart only as the Secrets init_env.py --apply-secrets creates
# (ADR-006). Upstream's values schema refuses no unknown key: charts/test_datahub.py checks that
# each key below is in upstream's values or read by its templates, and the rendered output for
# each value (ADR-016, ADR-072 §3).

# GMS, one replica with its MCE, MAE and platform-event consumers inside (ADR-071 §2).
datahub-gms:
  image:
    # Docker Hub index digest, read 2026-10-18 (pushed 2026-09-03). The chart and the images move
    # together, in a PR of their own (ADR-071 §1, §3). ADR-072 §1's patched line keeps the digest
    # out of GMS's version label.
    tag: "v1.7.0.1@sha256:74e15e982b94d0e147de41d05133ef3df48f74a1004a9c997805e0aa7e010173"
  service:
    type: ClusterIP
  # Ready is noticed sooner: first probe at 20 s, then every 5 s. Upstream's window (60 s +
  # 8 x 30 s = 300 s) is kept: 20 s + 56 x 5 s. Liveness stays upstream's.
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 56
    timeoutSeconds: 1
  extraEnvs:
    # One node holds every index: no replica, so the indices go green (ADR-070).
    - name: ELASTICSEARCH_NUM_REPLICAS_PER_INDEX
      value: "0"
    # Upstream passes the key only with managed ingestion on, which stays off below; without it
    # GMS encrypts with a built-in key (ADR-072 §2, ADR-076 §1).
    - name: SECRET_SERVICE_ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          name: datahub-encryption-secrets
          key: encryption_key_secret

# The frontend, one replica. Its secret is init-env's, not one the chart draws anew on every
# render, and its root user's password replaces the image's datahub:datahub (ADR-071 §6).
datahub-frontend:
  image:
    tag: "v1.7.0.1@sha256:99513cc1c45e4cc053ceb0f9aeb04a3263a8a747907bb0e85cac2eb03461310d"
  service:
    type: ClusterIP
  # As GMS's: upstream's window (60 s + 4 x 30 s = 180 s) is kept: 20 s + 32 x 5 s.
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 32
    timeoutSeconds: 1
  existingGmsSecret:
    name: datahub-frontend-secret
    key: secret
  extraVolumes:
    - name: root-user
      secret:
        secretName: datahub-root-user
  extraVolumeMounts:
    - name: root-user
      mountPath: /datahub-frontend/conf/user.props
      subPath: user.props
      readOnly: true

# Off: its executor installs packages from PyPI at run time (ADR-071 §2); ingestion runs from the
# CronJob below (ADR-076 §1).
acryl-datahub-actions:
  enabled: false

# Ingestion of Polaris's catalogs (ADR-076 §1, §2): one CronJob, polaris, running one ingestion per
# catalog of DATAHUB_INGEST_POLARIS_CATALOGS in turn. The install adds POLARIS_URI and that list to
# `env`, and suspends the CronJob while the list is empty (install/release.py).
datahub-ingestion-cron:
  enabled: true
  image:
    # The full variant, the only one with the iceberg source. Docker Hub index digest, read
    # 2026-10-19 (pushed 2026-09-03); it moves with Datahub's version (ADR-071 §1).
    tag: "v1.7.0.1@sha256:8845102fd495f2589e1ffc00dbd85cee3cbb700abc20d62fac1929ce95535620"
  crons:
    polaris:
      # Tuning values (ADR-076 §1): daily, in the controller's time zone; never two at once.
      schedule: "0 3 * * *"
      concurrencyPolicy: Forbid
      restartPolicy: Never
      backoffLimit: 1
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      # Every catalog runs, each named in the log; the Job fails if any run failed. The install
      # checks each name against ^[A-Za-z0-9_-]+$, so the list splits on commas alone. Upstream
      # writes this value unquoted into `command: ["/bin/sh", "-c", ...]`, so it carries its own
      # YAML single quotes, and the shell inside uses double quotes only; folded to one line.
      command: >-
        'status=0;
        for catalog in $(echo "$DATAHUB_INGEST_POLARIS_CATALOGS" | tr "," " "); do
        echo "catalog $catalog: ingesting";
        if POLARIS_CATALOG="$catalog" datahub ingest -c /etc/recipe/polaris.yml;
        then echo "catalog $catalog: passed";
        else echo "catalog $catalog: failed"; status=1;
        fi;
        done;
        exit $status'
      env:
        DATAHUB_SYSTEM_CLIENT_ID: __datahub_system
      envFromSecrets:
        POLARIS_CLIENT_ID:
          secret: datahub-polaris-principal
          key: clientId
        POLARIS_CLIENT_SECRET:
          secret: datahub-polaris-principal
          key: clientSecret
        # The sink authenticates as GMS's system client (ADR-076 §2).
        DATAHUB_SYSTEM_CLIENT_SECRET:
          secret: datahub-auth-secrets
          key: system_client_secret
      # No credential: the source expands each ${VAR} from the environment. No vended
      # credentials, no profiling, so no S3; stateful ingestion removes what a catalog dropped,
      # each catalog under its own pipeline.
      recipe:
        configmapName: datahub-ingestion-polaris-recipe
        fileName: polaris.yml
        fileContent:
          source:
            type: iceberg
            config:
              catalog:
                polaris:
                  type: rest
                  uri: ${POLARIS_URI}
                  oauth2-server-uri: ${POLARIS_URI}/v1/oauth/tokens
                  credential: ${POLARIS_CLIENT_ID}:${POLARIS_CLIENT_SECRET}
                  scope: PRINCIPAL_ROLE:ALL
                  warehouse: ${POLARIS_CATALOG}
                  header.Polaris-Realm: POLARIS
                  header.X-Iceberg-Access-Delegation: ""
              platform_instance: ${POLARIS_CATALOG}
              env: PROD
              profiling:
                enabled: false
              stateful_ingestion:
                enabled: true
                remove_stale_metadata: true
          pipeline_name: polaris-${POLARIS_CATALOG}
          sink:
            type: datahub-rest
            config:
              server: http://datahub-datahub-gms:8080

# The restore-indices CronJob template, suspended, from which a Job is created by hand
# (ADR-071 §2).
datahubUpgrade:
  enabled: true
  restoreIndices:
    resources:
      limits:
        # Upstream caps the Job at 500m; the slowest recovery phase gets two CPUs (ADR-071 §2, #229).
        cpu: "2"
  image:
    tag: "v1.7.0.1@sha256:c3db54d8fb94bc761be611c014c5ede3fd02daac1f15c8c177d69eceee79a24c"

# The blocking pre-install Job and the non-blocking post-install one, upstream's ZDU defaults.
datahubSystemUpdate:
  resources:
    limits:
      # Upstream caps both Jobs at 500m; they are the slowest install and recovery phases, so two
      # CPUs each (ADR-071 §2, #229). Requests and memory stay upstream's.
      cpu: "2"
  image:
    tag: "v1.7.0.1@sha256:c3db54d8fb94bc761be611c014c5ede3fd02daac1f15c8c177d69eceee79a24c"
  sql:
    setup:
      # datahub-pg's chart creates the database and its owner (ADR-066 §2). Upstream renders
      # `createDatabase | default "true"`, so this false still reaches the Job as "true"; its schema
      # takes a boolean only. On PostgreSQL the step then finds the database in pg_database and
      # creates nothing.
      createDatabase: false
      createUser: false
  extraEnvs:
    # System-update creates the indices (ADR-070).
    - name: ELASTICSEARCH_NUM_REPLICAS_PER_INDEX
      value: "0"

global:
  # Every Datahub pod is a client of its three stores and of GMS (ADR-071 §4, §5): the hook Jobs
  # take no other labels, and the frontend reaches Kafka and OpenSearch itself.
  podLabels:
    lakehouse/datahub-pg-client: "true"
    lakehouse/datahub-kafka-client: "true"
    lakehouse/datahub-opensearch-client: "true"
    lakehouse/datahub-gms-client: "true"

  # datahub-pg (ADR-066), its owner's password from init-env's Secret datahub-db.
  sql:
    datasource:
      host: datahub-pg-rw:5432
      port: "5432"
      url: jdbc:postgresql://datahub-pg-rw:5432/datahub
      driver: org.postgresql.Driver
      username: datahub
      password:
        secretRef: datahub-db
        secretKey: password

  # datahub-kafka, plaintext (ADR-068). Upstream's 5 MiB message size, topics with one partition
  # and replication factor 1, and its internal schema registry stay.
  kafka:
    bootstrap:
      server: datahub-kafka:9092

  # datahub-opensearch, plain HTTP without login and no index prefix (ADR-070).
  elasticsearch:
    host: datahub-opensearch
    port: "9200"
    useSSL: "false"

  datahub:
    # Off: no executor runs (ADR-071 §2, ADR-076 §1).
    managed_ingestion:
      enabled: false
    # init-env's Secrets under upstream's names and keys, never the chart's own (ADR-071 §6).
    metadata_service_authentication:
      provisionSecrets:
        enabled: false
    encryptionKey:
      provisionSecret:
        enabled: false
