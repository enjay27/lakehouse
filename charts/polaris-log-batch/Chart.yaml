# The Polaris log batch (ADR-014, ADR-024, ADR-036): a CronJob in Polaris's namespace that
# reads Polaris's per-pod log files on the shared claim and publishes each UTC hour once.
# Installed by install/release.py in step 2 (ADR-029, ADR-037). It shares only the claim with
# Polaris; the claim is not part of this chart.
apiVersion: v2
name: polaris-log-batch
description: The hourly batch over Polaris's per-pod log files
type: application
version: 0.1.0
appVersion: "1"
