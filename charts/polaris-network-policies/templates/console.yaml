{{- if .Values.console.enabled }}
{{- with .Values.callers.ingress }}
# The console's port, 8080 (charts/polaris-console's service.port): the ingress controller's
# namespace only, while the console is enabled (ADR-028, ADR-044 §3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-console
  labels:
    {{- include "polaris-network-policies.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: polaris-console
      app.kubernetes.io/instance: polaris-console
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
      from:
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
{{- end }}
{{- end }}
