# polaris-pg's instances, 5432: pods of this namespace labelled as its clients (Polaris, the
# realm bootstrap), and the other instances, which replicate from each other (ADR-044 §3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-pg-clients
  labels:
    {{- include "polaris-network-policies.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- include "polaris-network-policies.instances" . | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5432
      from:
        - podSelector:
            matchLabels:
              lakehouse/polaris-pg-client: "true"
        - podSelector:
            {{- include "polaris-network-policies.instances" . | nindent 12 }}
---
# The CNPG operator reads each instance's status on 8000 and connects on 5432; backups through
# the plugin start through the status port too (ADR-043, ADR-044 §3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-pg-operator
  labels:
    {{- include "polaris-network-policies.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- include "polaris-network-policies.instances" . | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
      from:
        {{- include "polaris-network-policies.namespaceNamed" .Values.namespaces.operator | nindent 8 }}
{{- with .Values.callers.metrics }}
---
# CNPG's exporter on each instance, 9187: the metrics scraper's namespace only (ADR-046 §4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-pg-metrics
  labels:
    {{- include "polaris-network-policies.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- include "polaris-network-policies.instances" $ | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 9187
      from:
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
{{- end }}
