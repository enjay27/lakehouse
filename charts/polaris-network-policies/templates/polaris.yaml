{{- $callers := .Values.callers }}
# Polaris's API, 8181: the gateway, user namespaces, Datahub's namespace, and the ingress
# controller while the console is enabled, since the console's browser calls the API through
# it (ADR-048 §3). Datahub's namespace is always a source, so this rule always has one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-api
  labels:
    {{- include "polaris-network-policies.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- include "polaris-network-policies.polaris" . | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8181
      from:
        {{- with $callers.gateway }}
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
        {{- end }}
        {{- with $callers.query }}
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
        {{- end }}
        {{- include "polaris-network-policies.namespaceNamed" .Values.namespaces.datahub | nindent 8 }}
        {{- if .Values.console.enabled }}
        {{- with $callers.ingress }}
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
        {{- end }}
        {{- end }}
{{- with $callers.metrics }}
---
# Polaris's management port, 8182 (health, metrics): the metrics scraper's namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: polaris-management
  labels:
    {{- include "polaris-network-policies.labels" $ | nindent 4 }}
spec:
  podSelector:
    {{- include "polaris-network-policies.polaris" $ | nindent 4 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8182
      from:
        {{- include "polaris-network-policies.namespace" . | nindent 8 }}
{{- end }}
