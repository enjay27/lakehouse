# install/release.py passes every value from .env (ADR-048 §2). values.schema.json refuses
# unknown keys, so a misspelt value fails instead of being ignored (ADR-016).

# One namespace label per caller class in other teams' namespaces, as {key, value}, parsed from
# POLARIS_GATEWAY_NAMESPACE_LABEL, POLARIS_QUERY_NAMESPACE_LABEL, METRICS_NAMESPACE_LABEL and
# INGRESS_NAMESPACE_LABEL. A class left out allows no namespace: its rule is not rendered.
callers: {}

# This repository's and the operator's namespaces, selected by kubernetes.io/metadata.name with
# the names from .env (NS_CATALOG_DATAHUB, NS_CNPG_SYSTEM). No default: never a name in a chart.
namespaces:
  datahub: ""
  operator: ""

# The console (ADR-028): its port and Polaris's API are open to the ingress controller only
# while it is enabled.
console:
  enabled: false
