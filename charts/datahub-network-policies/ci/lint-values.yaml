# What install/release.py passes from .env: read by helm lint in .github/workflows/static.yml and
# by the chart's tests, never installed. The chart has no default for the operator's namespace,
# so it is linted with one, and with both caller classes, so every rule renders.
namespaces:
  operator: cnpg-system
callers:
  ingress:
    key: lakehouse.example/caller
    value: ingress
  emitter:
    key: lakehouse.example/caller
    value: lineage-emitter
