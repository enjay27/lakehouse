# Where polaris-pg's WAL and base backups go (ADR-043): the backup bucket on the S3 endpoint
# from .env, with the backups' own key. The Barman Cloud Plugin, in the operator's namespace,
# reads it; gates/gate.py check-restore restores from it by this name.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: polaris-backup
  labels:
    app.kubernetes.io/name: polaris-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  retentionPolicy: {{ .Values.backup.retention | quote }}
  configuration:
    destinationPath: {{ printf "s3://%s/" .Values.backup.bucket | quote }}
    endpointURL: {{ .Values.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.credentialsSecret }}
        key: accessKeyId
      secretAccessKey:
        name: {{ .Values.backup.credentialsSecret }}
        key: secretAccessKey
