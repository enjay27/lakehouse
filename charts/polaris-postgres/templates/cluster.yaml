apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  # install/release.py waits for this name (POLARIS_PG).
  name: polaris-pg
  labels:
    app.kubernetes.io/name: polaris-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.image | quote }}
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: {{ .Values.podAntiAffinityType }}
    topologyKey: kubernetes.io/hostname
  smartShutdownTimeout: {{ .Values.smartShutdownTimeout }}
  {{- if ge (int .Values.instances) 3 }}
  # Commits wait for any one standby (ADR-056); with fewer instances, asynchronous.
  postgresql:
    synchronous:
      method: any
      number: {{ .Values.synchronous.number }}
      dataDurability: {{ .Values.synchronous.dataDurability }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
      secret:
        name: {{ .Values.credentialsSecret }}
  # WAL archived continuously through the Barman Cloud Plugin to objectstore.yaml (ADR-043).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: polaris-backup
  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
