# Defaults are the target clusters' (docs/plans/roadmap.md, pinned versions); an environment
# that cannot afford them overrides sizes only (ADR-008, ADR-017). values.schema.json refuses
# unknown keys, so a misspelt value fails instead of being ignored (ADR-016).

# Three instances, as on the target clusters (#9). CNPG's default is one.
instances: 3

# CNPG's PostgreSQL 16 image, pinned by tag and digest (ADR-010); the digest is the multi-arch
# index, read from ghcr.io on 2026-10-10.
image: ghcr.io/cloudnative-pg/postgresql:16.15-202610050823-minimal-trixie@sha256:37a7225a2577af6e7e274b50b278f89dcdaf7c2cf005a66402872f6ed39d58e3

# `required`: two instances never share a node, so losing a node loses one copy at most. It
# needs as many schedulable nodes as instances. CNPG's default is `preferred`.
podAntiAffinityType: required

# Seconds a stopping instance lets open sessions finish (PostgreSQL's smart shutdown) before
# a fast one, which rolls open transactions back; committed writes are kept either way. While
# it waits it refuses new connections, so a deleted primary is an outage for this long. 0 goes
# straight to a fast shutdown: failover.yml's C0 under S1 took ~185 s with CNPG's default of
# 180 and C1 8.4 s with 0 (#31). A tuning value (ADR-047 §8).
smartShutdownTimeout: 0

# How fast an instance whose PostgreSQL stops answering goes unready, and one back comes ready
# (CNPG's readiness probe). The primary going unready is what starts a failover, and the `-rw`
# Service follows readiness. CNPG's default probes every 10 s with a 5 s timeout, so a failure
# takes up to 30 s to see, and a primary back after a node loss waits up to 10 s: failover.yml's
# C0-S4-1 came back 9 s after C0-S4-3 (#178). 1 s, 1 s and 3 sees a failure within 3 s, as C1
# measured. The liveness probe stays CNPG's. Tuning values (ADR-047 §8).
probes:
  readiness:
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 3

# Synchronous replication (ADR-056): a commit returns once `number` of the standbys have it,
# whichever answer first (CNPG's `method: any`). `required`: commits wait while fewer standbys
# are healthy, so writes stop rather than lose a confirmed one; `preferred` would go on without
# them. Rendered only with 3 or more instances: with one standby, its restart would stop every
# write, so 1 or 2 instances replicate asynchronously. failover.yml's C1 lost no confirmed write
# with these, and C0 lost 25 and 29 without (#31). Tuning values (ADR-000 rule 11).
synchronous:
  number: 1
  dataDurability: required
  # CNPG promotes a standby only when the standbys it reaches must include one holding every
  # confirmed commit (ADR-058 §3). When the primary and a standby are lost together, writes wait
  # for one to come back instead. In failover.yml's S5, C1 without it lost 512 confirmed writes
  # over five runs and C1q with it none (#173). A forced `kubectl cnpg promote` still can.
  failoverQuorum: true

storage:
  size: 10Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""

# The database Polaris uses, owned by the user of the `polaris-db` Secret (basic-auth),
# created by scripts/init_env.py --apply-secrets (ADR-006).
database: polaris
owner: polaris
credentialsSecret: polaris-db

# Backups through the Barman Cloud Plugin (ADR-043). The endpoint and bucket have no default:
# install/release.py passes S3_ENDPOINT and POLARIS_BACKUP_BUCKET from .env. The key is the
# `polaris-backup-s3` Secret from scripts/init_env.py --apply-secrets (ADR-006).
backup:
  endpointURL: ""
  bucket: ""
  credentialsSecret: polaris-backup-s3
  # Base backups and WAL older than this are deleted by the plugin: <n>d, <n>w or <n>m.
  retention: 30d
  # CNPG's cron has seconds first: every day at 02:00 in the operator's time zone.
  schedule: "0 0 2 * * *"
