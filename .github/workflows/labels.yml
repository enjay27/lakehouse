# Creates or updates this repository's labels from .github/labels.json (ADR-003): the state
# labels sessions read and write. It only adds and updates; a label removed from the file is
# deleted by hand. Not a PR check, so auto-merge.yml does not list it.
# Runs after each successful Auto-merge run, because a merge made with GITHUB_TOKEN starts no
# `push` run on main (ADR-022); on a push to main that changes the file (Kade's own merges);
# or by hand. A workflow_run job checks out main, so it always syncs main's labels.json.
name: Labels

on:
  push:
    branches: [main]
    paths: [".github/labels.json", ".github/workflows/labels.yml"]
  workflow_run:
    workflows: ["Auto-merge"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      issues: write  # create and update labels
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create or update each label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r .name <<<"$label")
            gh label create "$name" --repo "$REPO" --force \
              --color "$(jq -r .color <<<"$label")" \
              --description "$(jq -r .description <<<"$label")"
            echo "synced $name"
          done
