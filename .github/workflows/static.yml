# The static gate (ADR-038): the tests of scripts/, gates/, install/ and the log batch
# (images/polaris-log-batch, ADR-036); helm lint, with a chart's ci/lint-values.yaml when it has
# one (ADR-043), then the
# charts/ tests: the rendered charts, their values schemas and kubeconform against the CRDs in
# use (ADR-016, ADR-010), with helm and kubeconform from gates/pins.json and PyYAML pinned by
# hash; the ADR check (ADR-000), the repository check (ADR-002, ADR-006), the CLAUDE.md limits
# and whitespace errors over the whole tree. Runs on every push to claude/** and main, and on
# every PR. On main it also runs after each successful Auto-merge run, whose merges start no
# push run, skipping a head that already passed, and weekly (ADR-055 §1). That run is the third
# workflow_run level, so nothing may chain after it. A failed or passing run on main from either
# trigger opens or closes "main is red: Static" (main-status.yml, ADR-055 §2).
# auto-merge.yml lists this workflow by its name, "Static" (ADR-022).
name: Static

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_run:
    workflows: ["Auto-merge"]
    types: [completed]
  schedule:
    - cron: "23 4 * * 1"

permissions: {}

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  already-passed:
    name: main's head already passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read  # this workflow's runs on main's head commit
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: After Auto-merge, stop if main's head already has a passing Static run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = workflow_run ]; then
            if [ "$CONCLUSION" != success ]; then
              skip=true
            else
              passed=$(gh api "repos/$REPO/actions/workflows/static.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq .total_count)
              if [ "$passed" -gt 0 ]; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "$EVENT on $SHA: skip=$skip"

  static:
    name: static
    needs: already-passed
    if: needs.already-passed.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Script tests
        run: python3 -m unittest discover -s scripts -v
      - name: Gate and install script tests
        run: |
          python3 -m unittest discover -s gates -v
          python3 -m unittest discover -s install -v
      - name: Log batch tests (ADR-036)
        run: python3 -m unittest discover -s images/polaris-log-batch -v
      - name: Chart tools and Python packages at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin" helm kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes -r charts/requirements.txt
      - name: helm lint
        run: |
          set -euo pipefail
          for chart in charts/*/Chart.yaml; do
            dir=$(dirname "$chart")
            if [ -f "$dir/ci/lint-values.yaml" ]; then
              helm lint --strict "$dir" -f "$dir/ci/lint-values.yaml"
            else
              helm lint --strict "$dir"
            fi
          done
      - name: Chart tests (ADR-016)
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s charts -v
      - name: ADRs follow ADR-000
        run: python3 scripts/adr_check.py
      - name: Repository check
        run: python3 scripts/repo_check.py
      - name: CLAUDE.md limits
        run: python3 scripts/claude_md_check.py
      - name: Whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  main-status:
    # A run on main from a schedule or Auto-merge opens or closes "main is red" (ADR-055 §2).
    needs: [already-passed, static]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
    permissions:
      issues: write
    uses: ./.github/workflows/main-status.yml
    with:
      result: ${{ needs.static.result }}
