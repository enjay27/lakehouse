# Merges a green pull request from a `claude/*` branch of this repository into main, then
# deletes the branch and closes the issues it names with `Closes #N` (ADR-022). Runs when a
# check workflow below completes; scripts/auto_merge_gate.py merges only when every check on
# the PR's head commit is green. Anything else is left for a person: a failed or cancelled
# check, another branch prefix, a fork, a stale run, a PR into any other branch.
# Add each new PR check workflow's name to `workflows:` in the PR that adds it. The merge also
# requires the checks `static` and `gate-check` (ADR-019) by name: with two workflows starting
# this one, either may finish before the other has started, and a check not started yet must
# not be skipped.
# `workflow_run` workflows are read from main, and the gate script is checked out from main,
# never from the PR: a change to either acts only after its own merge. Merges use
# GITHUB_TOKEN, so they start no `push` run on main; the PR's own runs are the gate.
# Ported from stella-rain/.github .github/workflows/auto-merge.yml at 144d317.
name: Auto-merge

on:
  workflow_run:
    workflows: ["Static", "Gate check"]
    types: [completed]

permissions: {}

jobs:
  merge:
    name: merge when every check is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write       # merge, delete the branch
      pull-requests: write  # merge
      issues: write         # close the PR's closing issues
      checks: read          # the head commit's check runs
      statuses: read        # the head commit's commit statuses
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out the gate script from main
        uses: actions/checkout@v7
        with:
          ref: main
          path: .gate
          persist-credentials: false

      - name: Merge if every check is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
                 --json number,headRefOid --jq '.[0]')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then echo "no open PR from $BRANCH into main"; exit 0; fi
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          # The green run must be for the PR's latest commit, not an older push.
          if [ "$head" != "$RUN_SHA" ]; then echo "run is for $RUN_SHA, PR head is $head; waiting for its runs"; exit 0; fi
          gh api --paginate "repos/$REPO/commits/$RUN_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion}' | jq -s . > "$RUNNER_TEMP/check-runs.json"
          gh api "repos/$REPO/commits/$RUN_SHA/status" \
            --jq '{state, total_count}' > "$RUNNER_TEMP/status.json"
          verdict=$(python3 .gate/scripts/auto_merge_gate.py --require static --require gate-check \
                      "$RUNNER_TEMP/check-runs.json" "$RUNNER_TEMP/status.json")
          echo "PR #$number at $RUN_SHA: $verdict"
          if [ "$verdict" != merge ]; then exit 0; fi
          # --match-head-commit refuses the merge if a push landed since the checks were read.
          gh pr merge "$number" --repo "$REPO" --merge --match-head-commit "$RUN_SHA"
          # Delete only a claude/* branch, and never anything else.
          case "$BRANCH" in
            claude/*) gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" ;;
            *) echo "not a claude/* branch; leaving $BRANCH" ;;
          esac
          gh pr view "$number" --repo "$REPO" --json closingIssuesReferences \
            --jq .closingIssuesReferences > "$RUNNER_TEMP/closing.json"
          for issue in $(python3 .gate/scripts/auto_merge_gate.py --issues-to-close "$RUNNER_TEMP/closing.json" "$REPO"); do
            gh issue close "$issue" --repo "$REPO" --reason completed --comment "Closed by #$number (auto-merge)."
          done
