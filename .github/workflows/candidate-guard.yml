# Candidate guard (ADR-080 §5, amended by §8). An rc/* branch is made only by Candidate, with
# GITHUB_TOKEN, which starts no workflow: any push to one is someone else's, and this workflow
# deletes it and fails (Promote checks the head against the tag anyway). There are no rulesets
# here, so this workflow undoes what a ruleset would refuse. There is no candidate/* branch any
# more: Candidate runs on main. A deletion is ignored, and the workflows' own deletions start no
# workflow either. It checks nothing out, so it runs none of the repository's code. It guards
# against mistakes: a push that changes this file runs the changed file.
name: Candidate guard

on:
  push:
    branches: ["rc/**"]

permissions: {}

jobs:
  guard:
    name: candidate branch unchanged
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # deleting a branch that broke the rule
    steps:
      - name: Delete an rc branch somebody pushed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == rc/* ]]; then
            echo "::error::$GITHUB_REF_NAME is made only by the Candidate workflow, never pushed; it is deleted, run Candidate again"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$GITHUB_REF_NAME" > /dev/null || true
            exit 1
          fi
