# The smoke gate (ADR-018): runs on a push to gate/smoke/<task> and nightly on main. Advisory:
# its result is reported in the PR, it does not block a merge (ADR-019). kind with three nodes
# and the pinned CNPG operator (ADR-017, ADR-029), the latest release tag installed from its
# checkout and this commit's release over it (ADR-021), or with `fresh` this commit's alone,
# then a one-instance PostgreSQL Cluster that must become Ready. The release gate calls it
# twice on every PR into rc, upgrade and fresh (ADR-033). Not a PR check into main, so
# auto-merge.yml does not list it.
name: Smoke

on:
  push:
    branches: ["gate/smoke/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      fresh:
        description: Install this commit alone, ignoring the last release.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fresh }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: Install the last release, then this commit over it (ADR-021)
        env:
          FRESH: ${{ inputs.fresh }}
        run: |
          set -euo pipefail
          if [ "$FRESH" = true ]; then
            python3 gates/gate.py install --fresh | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 gates/gate.py install | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: A PostgreSQL Cluster becomes Ready
        run: |
          python3 gates/gate.py smoke-cnpg
          echo "A one-instance CNPG Cluster became Ready." >> "$GITHUB_STEP_SUMMARY"

      - name: State of the cluster on failure
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" get nodes -o wide || true
          kubectl --context "$KUBE_CONTEXT" get pods -A -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n gate-smoke get events --sort-by=.lastTimestamp || true
