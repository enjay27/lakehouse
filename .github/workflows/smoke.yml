# The smoke gate (ADR-050): runs on a push to gate/smoke/<task> and nightly on main, and on a
# push to gate/smoke-fresh/<task> with `fresh`. A PR that changes platform files merges only
# when a passing run on gate/smoke/<task> covers its head (ADR-039). kind with
# three nodes and the pinned CNPG operator (ADR-017, ADR-029), cert-manager and the Barman Cloud
# Plugin (ADR-043), the gate's Secrets (ADR-006), the
# stand-ins for other teams' services (ADR-031), the latest release tag installed from its
# checkout, seeded with known data through its API, and this commit's release over it, which
# check-migration reads the seed back from (ADR-051), or with `fresh` this commit's alone;
# then one replica of polaris-pg is deleted with its volume and rejoins through CNPG's join pod
# under the network policies (ADR-048), the running Cluster polaris-pg is checked against its
# values, its three instances on three nodes (ADR-016), the stand-ins answer as Polaris needs them to (ADR-026), Polaris runs
# as its values say and gives root a token every replica accepts (ADR-016, ADR-026), PyIceberg
# as an ordinary principal writes a table into a catalog on the S3 endpoint and reads it back
# while the policy refuses what it is not granted (ADR-026, ADR-031), a backup of polaris-pg
# through the plugin restores into polaris-pg-restore, which holds the realm's root principal
# and that catalog (ADR-043), the log batch publishes
# the hour of traffic sent to both Polaris pods once, keeping the refused requests and counting
# the reads, and a stand-in Fluent Bit reads it as the contract (ADR-024, ADR-036), and the
# recorder saw those exchanges and none it must not (ADR-034).
# The console, built from its pinned commit while kind starts, is checked last: a
# maintainer signs in as the browser does and may only read; those steps never block, and a
# last step warns of any that failed (ADR-028). The release gate
# calls it twice on every PR into rc, upgrade and fresh (ADR-033). Not a PR check into main,
# so auto-merge.yml does not list it.
name: Smoke

on:
  push:
    branches: ["gate/smoke/**", "gate/smoke-fresh/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_call:
    inputs:
      fresh:
        description: Install this commit alone, ignoring the last release.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}-${{ inputs.fresh }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
      NS_CATALOG_POLARIS: catalog-polaris
      NS_CATALOG_DATAHUB: catalog-datahub
      NS_STANDINS: standins
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The console's image needs no cluster, so it builds in the background while kind starts
      # (#125). Its step below waits for the build, prints its log and loads the image.
      - name: The Polaris console's image starts building in the background (ADR-028)
        continue-on-error: true
        run: |
          nohup bash -c 'python3 gates/gate.py console-image --build; echo $? > "$RUNNER_TEMP/console-image.status"; mv "$RUNNER_TEMP/console-image.status" "$RUNNER_TEMP/console-image.exit"' \
            > "$RUNNER_TEMP/console-image.log" 2>&1 < /dev/null &

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: The gate's Secrets (ADR-006)
        run: python3 gates/gate.py secrets

      # The console is a maintainer tool: its failure is reported, never blocking (ADR-028).
      - name: The Polaris console's image, built from its pinned commit and loaded into kind (ADR-028)
        id: console-image
        continue-on-error: true
        run: |
          set -euo pipefail
          exit_file="$RUNNER_TEMP/console-image.exit"
          if ! timeout 900 bash -c "until [ -f '$exit_file' ]; do sleep 2; done"; then
            cat "$RUNNER_TEMP/console-image.log"
            echo "::error::The console's image build did not end within 900 s"
            exit 1
          fi
          cat "$RUNNER_TEMP/console-image.log"
          status="$(cat "$exit_file")"
          if [ "$status" != 0 ]; then
            echo "::error::The console's image build exited $status"
            exit 1
          fi
          python3 gates/gate.py console-image --load

      - name: The log batch's image, built from this checkout and loaded into kind (ADR-036)
        run: python3 gates/gate.py batch-image

      - name: The stand-ins, SeaweedFS and OPA (gate only, ADR-031)
        run: python3 gates/gate.py standins

      - name: Install the last release, seed it, then this commit over it (ADR-051)
        env:
          FRESH: ${{ inputs.fresh || startsWith(github.ref, 'refs/heads/gate/smoke-fresh/') }}
        run: |
          set -euo pipefail
          if [ "$FRESH" = true ]; then
            python3 gates/gate.py install --fresh | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 gates/gate.py install | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Every object seeded through the last release reads back from this commit's; no table lost rows (ADR-051)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-migration | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A replica deleted with its volume rejoins through CNPG's join pod under the network policies (ADR-048)
        run: |
          set -euo pipefail
          python3 gates/gate.py rebuild-replica | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The running Cluster polaris-pg matches its values (ADR-016)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-polaris-pg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The running Cluster datahub-pg matches its values, archives its WAL and backs up (ADR-066)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-datahub-pg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Datahub's Kafka takes a 4.5 MiB message from its client and keeps it across a restart (ADR-068)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-datahub-kafka | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Datahub's OpenSearch answers plain HTTP to its client and keeps a document across a restart (ADR-070)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-datahub-opensearch | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The stand-ins answer as Polaris needs them to (ADR-026, ADR-031)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-standins | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Polaris runs as its values say, and every replica accepts root's token (ADR-016, ADR-026)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-polaris | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Each caller reaches only what its rule allows; every other connection is refused (ADR-048)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-network | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PyIceberg as an ordinary principal writes and reads a table on S3; the policy refuses the rest (ADR-026, ADR-031)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-iceberg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A backup of polaris-pg through the plugin restores into a new Cluster that holds the catalog (ADR-043)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-restore | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The batch publishes both pods' traffic once; a stand-in Fluent Bit reads it as the contract (ADR-024, ADR-036)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-logs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The Prometheus stand-in, loading the scrape contract as it is, scrapes every Polaris pod and polaris-pg instance (ADR-046)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-metrics | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The recorder saw what it must, and nothing it must not (ADR-034)
        run: |
          set -euo pipefail
          python3 gates/gate.py check-traffic gates/expectations/standins.json gates/expectations/polaris.json gates/expectations/iceberg.json | tee -a "$GITHUB_STEP_SUMMARY"

      # The console is a maintainer tool: its checks are reported, never blocking (ADR-028).
      - name: A maintainer signs in to the console as the browser does; the policy lets it read only (ADR-026, ADR-028)
        id: console-sign-in
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 gates/gate.py check-console | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The recorder saw the policy endpoint answer the console's maintainer (ADR-028, ADR-034)
        id: console-traffic
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 gates/gate.py check-traffic gates/expectations/console.json | tee -a "$GITHUB_STEP_SUMMARY"

      # continue-on-error shows a failed console step as passed; this step says which failed.
      - name: The console's failed steps, reported and never blocking (ADR-028)
        if: ${{ !cancelled() }}
        env:
          CONSOLE_IMAGE: ${{ steps.console-image.outcome }}
          CONSOLE_SIGN_IN: ${{ steps.console-sign-in.outcome }}
          CONSOLE_TRAFFIC: ${{ steps.console-traffic.outcome }}
        run: |
          failed=0
          for step in CONSOLE_IMAGE CONSOLE_SIGN_IN CONSOLE_TRAFFIC; do
            if [ "${!step}" = failure ]; then
              failed=1
              echo "::warning title=Console step failed::$step failed; the console is not blocking (ADR-028), read its log"
              echo "- Console step $step failed (not blocking, ADR-028)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failed" = 0 ]; then
            echo "- The console's steps did not fail" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: State of the cluster on failure
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" get nodes -o wide || true
          kubectl --context "$KUBE_CONTEXT" get pods -A -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get cluster,pods,pvc -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get events --sort-by=.lastTimestamp || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_DATAHUB" get cluster,backup,statefulset,pods,pvc -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_DATAHUB" get events --sort-by=.lastTimestamp || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_DATAHUB" logs -l cnpg.io/cluster=datahub-pg,cnpg.io/podRole=instance --all-containers --prefix --tail=60 || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_DATAHUB" logs -l app.kubernetes.io/name=datahub-kafka --prefix --tail=80 || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_DATAHUB" logs -l app.kubernetes.io/instance=datahub-opensearch --all-containers --prefix --tail=80 || true
          kubectl --context "$KUBE_CONTEXT" get networkpolicies -A || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" exec deployment/prometheus -- wget -qO- 'http://127.0.0.1:9090/api/v1/targets?state=active' || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" get pods -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" get events --sort-by=.lastTimestamp || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" logs deployment/seaweedfs --tail=60 || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" logs deployment/opa --tail=60 || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_STANDINS" logs deployment/recorder --tail=60 || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get deployment,configmap -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" logs -l app.kubernetes.io/name=polaris --tail=80 --prefix || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get cronjob,job,pods -l app.kubernetes.io/name=polaris-log-batch -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" logs -l app.kubernetes.io/name=polaris-log-batch --tail=40 --prefix || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" logs -l app.kubernetes.io/name=fluent-bit-standin --tail=40 --prefix || true

  main-status:
    # The nightly run on main opens or closes "main is red: Smoke" (ADR-055 §2).
    needs: [smoke]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_run')
    permissions:
      issues: write
    uses: ./.github/workflows/main-status.yml
    with:
      result: ${{ needs.smoke.result }}

  delete-gate-branch:
    # The run's gate branch goes when the run ends, pass, fail or cancelled (ADR-049).
    needs: [smoke, main-status]
    if: always() && startsWith(github.ref, 'refs/heads/gate/')
    permissions:
      contents: write
    uses: ./.github/workflows/delete-gate-branch.yml
