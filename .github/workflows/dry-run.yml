# The dry-run gate (ADR-038): runs on a push to gate/dry-run/<task>, the same commit a session
# opens its PR from. gate-check (ADR-039) looks for a successful run of this workflow, by its
# path, on that branch. kind with three nodes and the pinned CNPG operator (ADR-017, ADR-029),
# then the gate's Secrets (gates/gate.py secrets, ADR-006), the console's image built while kind
# starts so the last release's console can roll out (ADR-028), the stand-ins for other teams'
# services (gates/gate.py standins, ADR-031), the latest release the commit
# contains (gates/gate.py released_tags), installed from a checkout of its tag, and a
# server-side dry-run of this commit's release over it (ADR-051); with no tag, this commit's
# alone. The release gate calls it on every PR into rc (ADR-033). Not a PR check
# into main, so auto-merge.yml does not list it.
name: Dry-run

on:
  push:
    branches: ["gate/dry-run/**"]
  workflow_call:

permissions: {}

concurrency:
  group: dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
      NS_CATALOG_POLARIS: catalog-polaris
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The console's image, as in smoke: without it the last release's install waits out the
      # console's 300 s rollout timeout (#125). It builds while kind starts.
      - name: The Polaris console's image starts building in the background (ADR-028)
        continue-on-error: true
        run: |
          nohup bash -c 'python3 gates/gate.py console-image --build; echo $? > "$RUNNER_TEMP/console-image.status"; mv "$RUNNER_TEMP/console-image.status" "$RUNNER_TEMP/console-image.exit"' \
            > "$RUNNER_TEMP/console-image.log" 2>&1 < /dev/null &

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: The gate's Secrets (ADR-006)
        run: python3 gates/gate.py secrets

      # The console is a maintainer tool: its failure is reported, never blocking (ADR-028).
      - name: The Polaris console's image, built from its pinned commit and loaded into kind (ADR-028)
        continue-on-error: true
        run: |
          set -euo pipefail
          exit_file="$RUNNER_TEMP/console-image.exit"
          if ! timeout 900 bash -c "until [ -f '$exit_file' ]; do sleep 2; done"; then
            cat "$RUNNER_TEMP/console-image.log"
            echo "::error::The console's image build did not end within 900 s"
            exit 1
          fi
          cat "$RUNNER_TEMP/console-image.log"
          status="$(cat "$exit_file")"
          if [ "$status" != 0 ]; then
            echo "::error::The console's image build exited $status"
            exit 1
          fi
          python3 gates/gate.py console-image --load

      - name: The stand-ins, SeaweedFS and OPA (gate only, ADR-031)
        run: python3 gates/gate.py standins

      - name: Install the last release, then dry-run this commit over it (ADR-051)
        run: |
          set -euo pipefail  # the default `bash -e` would let tee hide a failed install
          python3 gates/gate.py install --dry-run | tee -a "$GITHUB_STEP_SUMMARY"

  delete-gate-branch:
    # The run's gate branch goes when the run ends, pass, fail or cancelled (ADR-049).
    needs: [dry-run]
    if: always() && startsWith(github.ref, 'refs/heads/gate/')
    permissions:
      contents: write
    uses: ./.github/workflows/delete-gate-branch.yml
