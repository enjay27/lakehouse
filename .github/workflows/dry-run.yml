# The dry-run gate (ADR-038): runs on a push to gate/dry-run/<task>, the same commit a session
# opens its PR from. gate-check (ADR-039) looks for a successful run of this workflow, by its
# path, on that branch. kind with three nodes and the pinned CNPG operator (ADR-017, ADR-029),
# then the gate's Secrets (gates/gate.py secrets, ADR-006), the stand-ins for other teams'
# services (gates/gate.py standins, ADR-031), the latest release the commit
# contains (gates/gate.py released_tags), installed from a checkout of its tag, and a
# server-side dry-run of this commit's release over it (ADR-021); with no tag, this commit's
# alone. The release gate calls it on every PR into rc (ADR-033). Not a PR check
# into main, so auto-merge.yml does not list it.
name: Dry-run

on:
  push:
    branches: ["gate/dry-run/**"]
  workflow_call:

permissions: {}

concurrency:
  group: dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
      NS_CATALOG_POLARIS: catalog-polaris
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: The gate's Secrets (ADR-006)
        run: python3 gates/gate.py secrets

      - name: The stand-ins, SeaweedFS and OPA (gate only, ADR-031)
        run: python3 gates/gate.py standins

      - name: Install the last release, then dry-run this commit over it (ADR-021)
        run: |
          set -euo pipefail  # the default `bash -e` would let tee hide a failed install
          python3 gates/gate.py install --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
