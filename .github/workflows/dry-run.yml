# The dry-run gate (ADR-018): runs on a push to gate/dry-run/<task>, the same commit a session
# opens its PR from. gate-check (ADR-019) looks for a successful run of this workflow, by its
# path, on that branch. kind with three nodes and the pinned CNPG operator (ADR-017, ADR-029),
# then the release install script. Until the first release tag there is nothing to upgrade
# from (ADR-021); a tag stops the run until the upgrade path is built. Not a PR check, so
# auto-merge.yml does not list it.
name: Dry-run

on:
  push:
    branches: ["gate/dry-run/**"]

permissions: {}

concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No release to upgrade from yet (ADR-021)
        run: |
          set -euo pipefail
          tag=$(git tag --merged HEAD --list 'platform-*' --sort=-creatordate | head -n 1)
          if [ -n "$tag" ]; then
            echo "::error::release $tag exists; the upgrade from a tag (ADR-021) is not built yet"
            exit 1
          fi
          echo "No release to upgrade from: fresh install (ADR-021)." >> "$GITHUB_STEP_SUMMARY"

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: Release install script
        run: python3 install/release.py | tee -a "$GITHUB_STEP_SUMMARY"
