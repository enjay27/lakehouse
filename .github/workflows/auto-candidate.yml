# Auto-candidate (ADR-080, release-flow step 2). Once Static has passed on a main commit that
# changes what a release ships, this workflow pushes candidate/<12-character sha> at that commit,
# so no agent has to push it by hand. Kade still starts Candidate and Promote. An agent pushes
# by hand only when this run failed or Static was red.
#   - Runs after each Static run on main that passed and came from a push (Kade's own merge) or
#     from Auto-merge (a workflow_run: auto-merge merges with GITHUB_TOKEN, which starts no push
#     run, so Static runs on main after Auto-merge, ADR-055). The weekly run does not decide.
#   - Chain depth: GitHub allows workflow_run chains of at most three levels after the first
#     workflow (A -> B -> C -> D runs, E does not; "Events that trigger workflows",
#     workflow_run). Kade's merge: push -> Static -> Auto-candidate. An auto-merge: PR Static
#     (A) -> Auto-merge (B) -> Static (C) -> Auto-candidate (D), the last level that runs. Nothing
#     may chain after this workflow. static.yml counts Static after Auto-merge as the third level;
#     that is not yet seen running here, and a candidate that fails to appear is pushed by hand.
#   - install/release_tag.py should-candidate: HEAD has no platform-* tag and a file under
#     charts/, images/ or install/ changed since the latest release. ci-done "Static": every
#     Static run on the commit by push, dispatch or workflow_run has finished and passed.
#     Still running -> it pushes nothing, a later run decides; a failure -> no candidate.
#   - Only the newest main is a candidate: a run whose commit is no longer main's head does
#     nothing, and an unused candidate branch at an older commit is deleted first.
#   - While Candidate is running or queued it pushes nothing and fails, so the branch Candidate
#     reads is never deleted under it; an agent pushes the branch by hand afterwards.
#   - It fails only when it could not push; that is when Kade asks an agent to push by hand.
# Its own concurrency group is not `release`: a queued run there would cancel Candidate's.
# The branch is created with GITHUB_TOKEN, which starts no workflow, so the guard does not run
# on it; Candidate checks the name, main, the head and the checks again (candidate.yml). Only
# the push job can write, and it checks nothing out and runs none of the repository's code.
# `workflow_run` is read from main: a change to this file acts only after its own merge.
name: Auto-candidate

on:
  workflow_run:
    workflows: ["Static"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: auto-candidate
  cancel-in-progress: false

jobs:
  decide:
    name: decide on a candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the workflow runs on the commit
    outputs:
      push: ${{ steps.decide.outputs.push }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Something a release ships changed, and main's Static passed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "push=false" >> "$GITHUB_OUTPUT"
          if [ "$(python3 install/release_tag.py should-candidate 2> "$RUNNER_TEMP/why.txt")" != true ]; then
            { echo "No candidate at ${SHA:0:12}."; echo; echo '```'; cat "$RUNNER_TEMP/why.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          ci=$(python3 install/release_tag.py ci-done "Static" < "$RUNNER_TEMP/runs.json")
          if [ "$ci" = waiting ]; then
            echo "Static is still running at ${SHA:0:12}: a later run decides." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [ "$ci" = red ]; then
            echo "Static is red at ${SHA:0:12}: no candidate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "A release-shipped file changed and Static passed at ${SHA:0:12}: pushing a candidate branch." >> "$GITHUB_STEP_SUMMARY"
          echo "push=true" >> "$GITHUB_OUTPUT"

  push:
    name: push the candidate branch
    needs: decide
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # creating the candidate branch, deleting an unused one
      actions: read    # whether Candidate is running
    steps:
      - name: Push candidate/<sha> at main, replacing an unused candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          branch="candidate/${SHA:0:12}"
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$main" != "$SHA" ]; then
            echo "main has moved on to $main; its own checks decide on a candidate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          running=$(gh api "repos/$REPO/actions/workflows/candidate.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$running" != 0 ]; then
            echo "::error::Candidate is running; once it has finished, push $branch by hand (release-flow, step 2)"
            exit 1
          fi
          exists=false
          for ref in $(gh api "repos/$REPO/git/matching-refs/heads/candidate/" --jq '.[].ref'); do
            old=${ref#refs/heads/}
            if [ "$old" = "$branch" ]; then exists=true; continue; fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$old" > /dev/null
            echo "Deleted the unused $old." >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$exists" = false ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" > /dev/null
          fi
          echo "Ready: Actions > Candidate > Run workflow > branch \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
