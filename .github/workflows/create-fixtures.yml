# Create Fixtures (ADR-040): Polaris's own log files across a real UTC hour, as a release writes
# them. kind with this commit installed fresh, as the smoke gate builds it (ADR-017, ADR-029,
# ADR-031, ADR-038); then gates/fixtures.py capture: traffic with one 500 per pod, a wait for
# the next UTC hour plus 60 s, traffic again, each pod's roll and current file copied with a
# manifest of their hashes and mtimes. Uploaded as the artifact polaris-log-fixtures-<spec hash>
# for 90 days, nothing committed. Called by log-batch.yml when the spec changed, monthly on
# main so an artifact outlives the expiry (GitHub disables the schedule after 60 days without
# activity: re-enable it in the Actions tab, or run it by hand), and by hand. It runs on main
# and gate branches, not on PRs, so auto-merge.yml does not list it. This file is part of the
# spec (gates/fixtures.py): changing it makes new fixtures.
name: Create fixtures

on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch: {}
  workflow_call:
    outputs:
      artifact:
        description: The artifact's name, polaris-log-fixtures-<spec hash>.
        value: ${{ jobs.capture.outputs.artifact }}

permissions: {}

jobs:
  capture:
    name: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.spec.outputs.artifact }}
    env:
      KUBE_CONTEXT: kind-lakehouse-gate
      NS_CNPG_SYSTEM: cnpg-system
      NS_CATALOG_POLARIS: catalog-polaris
      NS_STANDINS: standins
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The spec hash names the artifact
        id: spec
        run: echo "artifact=polaris-log-fixtures-$(python3 gates/fixtures.py spec-hash)" >> "$GITHUB_OUTPUT"

      - name: Tools at pinned versions
        run: |
          python3 gates/gate.py tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kind cluster and the CNPG operator (gate only, ADR-029)
        run: python3 gates/gate.py up

      - name: The gate's Secrets (ADR-006)
        run: python3 gates/gate.py secrets

      - name: The log batch's image, built from this checkout and loaded into kind (ADR-036)
        run: python3 gates/gate.py batch-image

      - name: The stand-ins (gate only, ADR-031)
        run: python3 gates/gate.py standins

      - name: Install this commit (ADR-029)
        run: |
          set -euo pipefail
          python3 gates/gate.py install --fresh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Traffic, a real UTC hour, traffic again; the files and their manifest (ADR-040)
        run: python3 gates/fixtures.py capture "$RUNNER_TEMP/fixtures"

      - name: Upload the fixtures
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.spec.outputs.artifact }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 90
          if-no-files-found: error

      - name: State of the cluster on failure
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" get pods -A -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get cronjob,job,pods,pvc -o wide || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" get events --sort-by=.lastTimestamp || true
          kubectl --context "$KUBE_CONTEXT" -n "$NS_CATALOG_POLARIS" logs -l app.kubernetes.io/name=polaris --tail=80 --prefix || true
          ls -laR /tmp/lakehouse-gate-shared || true
