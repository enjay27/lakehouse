# The log-batch gate (ADR-040): runs on a push to gate/log-batch/<task>, the same commit as the
# PR's head (ADR-038). A first job reads the diff against main: when the fixture spec changed
# (gates/fixtures.py), Create Fixtures runs first and the gate uses its artifact; otherwise the
# gate uses the latest unexpired artifact for this spec hash, and fails when there is none. The
# gate (gates/log_batch_gate.py) refuses an artifact that differs from its manifest, runs the
# batch built from this commit over it, ships the outputs through a stand-in Fluent Bit into an
# OpenSearch stand-in, and checks what OpenSearch holds. It runs on gate branches, not on PRs,
# so auto-merge.yml does not list it.
name: Log batch

on:
  push:
    branches: ["gate/log-batch/**"]

permissions: {}

concurrency:
  group: log-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      spec_changed: ${{ steps.diff.outputs.spec_changed }}
      spec_hash: ${{ steps.diff.outputs.spec_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did the fixture spec change against main?
        id: diff
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          python3 gates/fixtures.py changes "$base" | tee -a "$GITHUB_OUTPUT"
          echo "Changed against main: $(git diff --name-only "$base" HEAD | wc -l) files" \
            >> "$GITHUB_STEP_SUMMARY"

  fixtures:
    name: create fixtures
    needs: changes
    if: needs.changes.outputs.spec_changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/create-fixtures.yml

  gate:
    name: log-batch
    needs: [changes, fixtures]
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.fixtures.result == 'success' || needs.fixtures.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read  # the artifact of another run
    env:
      ARTIFACT: polaris-log-fixtures-${{ needs.changes.outputs.spec_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The run that holds the latest artifact for this spec hash
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          THIS_RUN: ${{ needs.fixtures.result == 'success' && github.run_id || '' }}
        run: |
          set -euo pipefail
          if [ -n "$THIS_RUN" ]; then
            run_id=$THIS_RUN
          else
            run_id=$(gh api -X GET "repos/$REPO/actions/artifacts" -f name="$ARTIFACT" \
              -F per_page=100 --jq '[.artifacts[] | select(.expired | not)]
                | sort_by(.created_at) | last | .workflow_run.id // empty')
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No unexpired artifact $ARTIFACT: run Create Fixtures by hand"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Fixtures: $ARTIFACT from run $run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the fixtures
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/fixtures
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: The artifact matches its manifest and this checkout's spec (ADR-040)
        run: |
          set -euo pipefail
          python3 gates/log_batch_gate.py verify "$RUNNER_TEMP/fixtures" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The batch over the fixtures, through Fluent Bit into OpenSearch (ADR-024, ADR-040)
        run: |
          set -euo pipefail
          python3 gates/log_batch_gate.py run "$RUNNER_TEMP/fixtures" | tee -a "$GITHUB_STEP_SUMMARY"
